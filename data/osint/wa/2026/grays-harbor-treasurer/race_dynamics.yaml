prediction: Genuinely competitive. This is the most evenly matched race in the Grays
  Harbor 2026 cycle. Hill has deep operational expertise (9 years as chief deputy),
  a clean audit record, a Leadership and Service Award, and demonstrated process
  improvements. Cormier has strong name recognition (8 years as commissioner), R
  label advantage in an R+6 county, and executive-level fiscal management experience
  with a $100M+ budget. Hill's non-partisan messaging and Cormier's taxpayer-protection
  brand will both resonate with different segments. Partisan dynamics slightly favor
  Cormier, but Hill's track record is formidable.
key_issues:
- County financial stability amid $8.5M budget deficit
- Property tax processing efficiency (Hill's lock box innovation)
- Deposit security and investment management
- Trust and accountability in county financial offices
- State auditor compliance and reporting
context: >
  The Treasurer race is a classic insider-vs-outsider matchup. Shawn Hill rose through
  the ranks — 9 years as Chief Deputy Treasurer under Kenneth Albert, then appointed
  to replace him in July 2025. His BS in Accounting and hands-on modernization work
  (property tax lock box, credit card processing, electronic filing) make him the
  operational expert. He received the BOCC's Leadership and Service Award for
  achieving a clean financial audit.

  Wes Cormier is the well-known former County Commissioner (2012-2020) seeking to
  return to county government after a failed 2020 State Senate bid. His 8 years
  overseeing a $100M+ county budget and 7 years as a real estate appraiser in the
  Assessor's Office give him relevant financial policy experience, though he lacks
  direct treasury operations experience.

  Hill emphasizes non-partisan management — a strategic necessity as a Democrat in
  an R+6 county. Cormier runs on fiscal conservatism and taxpayer protection,
  highlighting his record of voting against property tax increases seven consecutive
  years as commissioner. The race may ultimately hinge on whether voters prioritize
  operational expertise (Hill) or executive-level fiscal management and Republican
  alignment (Cormier).
