context: >
  The 2026 Grays Harbor Assessor race is an asymmetric contest between a well-established
  three-term incumbent and an unknown challenger. Dan Lindgren has held the office
  since January 2015, having joined the Assessor's Office as an appraiser in 2007.
  His tenure has been marked by technology modernization (MapGeo GIS platform — first
  county in WA to adopt it), record-low property value appeals, and statewide
  professional leadership (WSACA technology committee chair for 11 years, unanimously
  elected to WACO executive board).

  The most notable development is Lindgren's party switch from Democrat to Republican
  in April 2026. He previously won three elections as a Democrat in a county that has
  trended Republican (Trump 51.4% in 2024). His opponent Josh Nuxoll, filing as
  Independent, has no discoverable public record of relevant experience, no campaign
  infrastructure, and no media coverage.

  Note: Patti McLean, initially identified as a candidate, is actually the Mason County
  Assessor running unopposed for re-election in Mason County. She previously worked
  14 months in the Grays Harbor Assessor's Office but is not a candidate here.
