- title: Republican Vote Splitting — Two Rs vs One Non-Partisan
  category: pattern
  description: Mitchell and Streifel are both running as Republicans, while Sturgeon
    is non-partisan. In Washington's top-two primary, the two Republican candidates
    will split the conservative vote, potentially allowing the non-partisan Sturgeon
    to advance alongside one Republican. Mitchell's candidacy may function as a spoiler
    in a county where R-leaning voters dominate.
  source_tier: T1
  political_impact: Moderate
  defense: Mitchell may have genuine policy disagreements with Streifel that justify
    his candidacy. Under the top-two system, the strongest two candidates advance
    regardless, so the outcome reflects genuine voter preferences.
  source_urls:
  - https://www.thedailyworld.com/2026/05/11/grays-harbor-county-2026-primary-races-set/
