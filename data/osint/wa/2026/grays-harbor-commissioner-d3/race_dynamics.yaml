prediction: Streifel is the favorite by default — he has name recognition from two
  prior campaigns, the appointed incumbency advantage, and established party
  affiliation. However, his 22% showing in the 2022 primary for this same seat is a
  warning sign. The Republican vote split between Streifel and Mitchell could benefit
  Sturgeon in the top-two primary. If Sturgeon or Mitchell can build any campaign
  presence, this becomes more competitive than it appears on paper.
key_issues:
- $8.5 million county budget deficit — departments asked to cut 15%
- County administrator vacancy — Sam Kim resigned May 2026 amid budget crisis
- County auditor scandal — DOL contract termination, commissioner called for resignation
- Sheriff's office staffing — potential loss of 7 deputies and 2 corrections officers
- Comprehensive Land Use and Parks Plans implementation
- Coastal flooding — Ocean City Drainage District and North Beach infrastructure
- Economic development in a county with 15% poverty rate
context: >
  The Commissioner District 3 seat opened when Vickie Raines — a fixture of Grays
  Harbor politics for over 26 years — resigned to become CEO of a healthcare
  organization. Raines had handily defeated Streifel in the 2022 primary (46% to
  22%). Now Streifel has been appointed to the seat he previously lost.

  The county is in crisis mode. The $8.5 million budget deficit has forced 15% cuts
  across departments. County Administrator Sam Kim resigned in May 2026. The county
  auditor had his DOL contract terminated after repeated performance failures. The
  sheriff's office faces losing 9 positions. Whoever holds this seat will inherit
  severe fiscal and operational challenges.

  The three-way race features two Republicans (Streifel, Mitchell) and one
  non-partisan (Sturgeon). Under Washington's top-two primary, the Republican vote
  split could allow Sturgeon to advance. However, neither Sturgeon nor Mitchell has
  any visible campaign infrastructure, media presence, or identifiable qualifications
  — making Streifel the prohibitive favorite despite his prior electoral losses.
