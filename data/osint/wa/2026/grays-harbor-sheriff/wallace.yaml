political_positions:
  positions:
  - topic: Jail Replacement
    topic_id: jail
    current_position:
      claim: Top priority is a new jail facility. Current 45-year-old facility requires constant repairs and is vertical in design, which is cumbersome. Wants to model new facility after Skagit County's linear design. Estimated cost $80 million. Goal is securing approvals during his term.
      sources:
      - daily_world
      highest_tier: T2
      confidence: corroborated
  - topic: Transparency / Body Cameras
    topic_id: transparency
    current_position:
      claim: Invested $900,000 in body cameras for deputies and patrol cars, plus interview room cameras. Prioritizes transparency and positive community communication.
      sources:
      - daily_world
      highest_tier: T2
      confidence: corroborated
  - topic: Staffing
    topic_id: staffing
    current_position:
      claim: Faces staffing shortages including one patrol deputy, four to five corrections deputies, and four support specialists. Acknowledges recruiting challenges.
      sources:
      - daily_world
      highest_tier: T2
      confidence: corroborated
  - topic: Crime Priorities
    topic_id: crime
    current_position:
      claim: Major crime issues are stolen vehicles, catalytic converter thefts, and drug-related crimes.
