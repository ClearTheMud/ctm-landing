prediction: Wallace is a strong favorite. He won his first election with over 73% of
  the vote, brings Coast Guard command experience plus a full career progression through
  GHCSO (deputy, sergeant, detective sergeant, chief civil deputy, sheriff), and has
  delivered on transparency promises (body cameras, interview room cameras). Welter
  faces multiple vulnerabilities — Brady List profile, campaign email using sheriff's
  office domain, three simultaneous public offices, and limited GHCSO rank progression.
  However, Welter's local roots (Mayor of Westport, hospital board) give him a base
  in the South Beach area. Unless Welter surfaces significant malfeasance by Wallace,
  this should be a comfortable incumbent win.
key_issues:
- $80 million jail replacement — aging 45-year facility needs rebuild
- Staffing shortages — patrol, corrections, and support positions unfilled
- Budget cuts — 2024 threat to cut 7 deputies if county budget cuts proceeded
- Drug-related crime, stolen vehicles, and catalytic converter thefts
- Body camera deployment and transparency
context: >
  This race mirrors a dynamic seen across several Washington counties — a detective
  challenging his own sheriff. Edward Welter, currently a GHCSO detective and the
  Mayor of Westport, is running against incumbent Sheriff Darrin Wallace, who is his
  direct chain of command. Wallace won the 2022 election overwhelmingly after rising
  through the ranks from deputy to Chief Civil Deputy under retiring Sheriff Rick
  Scott, who served 45 years.

  Wallace's biggest challenge is institutional — the 45-year-old jail needs an $80
  million replacement, the department faces chronic staffing shortages, and county
  budget pressures threaten further cuts. His biggest political asset is the same
  73% mandate that carried him into office.

  Welter brings an unusual profile: Coast Guard veteran, former Fish and Wildlife
  officer, current GHCSO detective, elected Mayor of Westport, and hospital board
  member. His Brady List profile — which shows no material but flags GHCSO's
  non-compliance with disclosure obligations — could be weaponized by either side.
  His use of an email domain resembling the sheriff's office for campaign purposes
  adds an optics issue.

  Neither candidate claims a party preference, making this a personality-and-record
  contest rather than a partisan one.
