county: Grays Harbor
state: WA
election_year: 2026
primary_date: '2026-08-04'
general_date: '2026-11-03'
partisan_lean: Lean Republican (R+6). Trump 51.4% in 2024. However, Democrats have
  held the Prosecutor seat since Katie Svoboda's appointment (elevated to Superior
  Court Judge 2021), through Norma Tillotson (appointed 2021, elected 2022), to
  Walker (appointed 2026). The office has been in Democratic hands for years despite
  the county's rightward drift.
incumbent: Jason F. Walker (Democrat, appointed March 17, 2026, replacing resigned
  Norma Tillotson)
salary: $237,460/year — highest-paid elected official in the county
candidates:
- name: Jason F. Walker
  party: Democrat
  status: Incumbent (appointed March 2026, first-time candidate)
- name: Daniel Crawford
  party: Republican
  status: Challenger (current Chief Criminal Deputy Prosecutor under Walker)
prediction: Genuinely competitive race. Walker has incumbency, deep institutional
  knowledge (11 years in the office), and statewide training credentials. Crawford
  has a formidable trial record (Carter conviction — 46.5 years, Palmer, Baier),
  Republican registration in a Republican-leaning county, and the optics of being
  passed over for appointment in favor of a party-selected candidate. The partisan
  dynamics favor Crawford in the general. Walker's advantage is being known in the
  legal community and having the governor-appointment legitimacy. Could go either way.
key_issues:
- Office stability — Tillotson's tenure saw two internal investigations, high turnover,
  and a negative reputation that hindered recruitment
- Staff retention — of 11 positions that received raises in 2023, only 3 employees remained
- Prosecutor compensation — Crawford requested $89,376 in raises for three prosecutors
- Violent crime prosecution — both candidates emphasize being tough on crime
- Therapeutic courts vs incarceration — Crawford supports both approaches
context: >
  The Grays Harbor Prosecutor's race features two experienced prosecutors in an
  unusual subordinate-vs-boss dynamic. Jason Walker spent 11 years in the office
  (December 2011 — December 2022), including 7+ years as chief criminal deputy,
  before leaving for a statewide role at the Washington Association of Prosecuting
  Attorneys. He was appointed prosecutor in March 2026 after Norma Tillotson resigned.

  Daniel Crawford is the current Chief Criminal Deputy Prosecutor — the #2 position
  in the office — and has been in Grays Harbor since August 2024. He was recruited
  from Pacific County, where his former boss called him 'the backbone of the criminal
  division.' Crawford has already secured major convictions in Grays Harbor, including
  the Riley Carter case (former Aberdeen City Councilor convicted on 8 counts of
  child sex crimes, sentenced to 46.5 years).

  The appointment process is central to the race's dynamics. When Tillotson resigned,
  the Grays Harbor Democrats nominated three candidates per state law. Crawford, as
  a Republican, was ineligible for nomination regardless of merit. The BOCC selected
  Walker. Crawford now runs as the candidate who was passed over by process, not by
  performance.

  Tillotson's legacy of office dysfunction hangs over both candidates. Walker must
  prove he can stabilize the office he inherited; Crawford must explain why the
  dysfunction should be attributed to Democratic management rather than institutional
  factors he was also part of.
