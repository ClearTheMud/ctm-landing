context: >
  The 2026 Grays Harbor Auditor race is defined by the scandal surrounding incumbent
  Joseph R. MacLean. In March 2026, the Washington Department of Licensing terminated
  the county's vehicle and vessel licensing contract with MacLean's office after
  issuing a Level III Breach of Contract notice — the culmination of 'repeated
  unsuccessful corrective action attempts since 2021.' Commissioner Georgia Miller
  publicly called for MacLean's immediate resignation, citing 'ongoing and unresolved
  performance issues' including delays exceeding 100 days in submitting materials to
  the State Auditor's Office.

  Both candidates are running for a scandal-tainted open seat. Charlee Paull (R) has
  built the more visible campaign, declaring in November 2025 at a community event
  she organized in Oakville. Her banking and mortgage career is her primary
  qualification argument. Brielle Joyce (D) has virtually no public presence — no
  campaign website, no media coverage, and no discoverable professional background.

  The county administrator Sam Kim, who was appointed as the emergency licensing
  agent after MacLean's contract termination, himself resigned in May 2026 — adding
  another layer of institutional instability that the next auditor will inherit.
