candidate_name: Charlee Paull
findings:
- title: No Government or Auditing Experience
  category: character
  description: Paull's entire 19-year career has been in private-sector banking and
    mortgage lending. She has no experience in government administration, elections
    management, property tax collection, vehicle/vessel licensing, or any of the
    county auditor's core functions. The WA county auditor role encompasses elections,
    financial accounting, recording, and licensing — none of which directly correlate
    to mortgage origination.
  source_tier: T2
  political_impact: Moderate
  defense: Paull emphasizes that banking requires precision, integrity, and
    regulatory compliance — transferable skills for auditor functions. Her mortgage
    lending experience involves property records, title searches, and financial
    documentation that touch the auditor's domain. The incumbent (MacLean) had
    government experience and still lost the DOL contract.
  source_urls:
  - https://www.chronline.com/stories/oakville-native-charlee-paull-declares-candidacy-for-county-auditor,391813
