candidate_name: Angela Taylor
findings:
- title: Single Prior Race — Lost Cemetery District Commissioner (26.88%)
  category: policy
  description: Taylor's only prior political experience is losing a Thurston County Cemetery District 2 commissioner race
    in 2025 with 26.88% of the vote. She is stepping up from the most hyperlocal level of government to a state legislative
    race with no visible organizational support. Splitting the Democratic vote with Martin L Miller further reduces her chances
    of advancing past the top-two primary.
  source_tier: T1
  political_impact: High
  defense: Her education levy advocacy through Citizens of Yelm Schools demonstrates community engagement and grassroots organizing
    experience.
