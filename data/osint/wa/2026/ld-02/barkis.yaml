political_positions:
  positions:
  - topic: Housing / Rent Control
    topic_id: housing_rent_control
    current_position:
      claim: Pro-supply, anti-rent control. Sponsored HB 1096 (lot splitting, signed into law 2025). Opposes rent caps, arguing
        they reduce housing supply.
      sources:
      - wa_leg
      - house_r
      highest_tier: T1
      confidence: verified
  - topic: Taxes
    topic_id: taxes
    current_position:
      claim: Opposes all new taxes. Stated 'the only acceptable dollar amount for tax increases is zero.' Voted against capital
        gains, income tax, business services taxes.
      sources:
      - house_r
      highest_tier: T1
      confidence: verified
  - topic: Transportation
    topic_id: transportation
    current_position:
      claim: Ranking Republican on House Transportation Committee. Prioritizes road preservation over transit. Opposed Move
        Ahead Washington. Wants CCA surplus redirected to roads. Cites WA ranking 47th in road quality.
      sources:
      - wa_leg
      - house_r
      highest_tier: T1
      confidence: verified
  - topic: Public Safety
    topic_id: public_safety
    current_position:
      claim: Pro-law enforcement. Wants to reverse 2021 police reform restrictions. Supports officer pursuit discretion.
      sources:
      - shift_wa
      - house_r
      highest_tier: T2
      confidence: corroborated
  - topic: Firearms / Second Amendment
    topic_id: firearms
    current_position:
      claim: Strong Second Amendment supporter. Opposed HB 1143 (firearm purchase requirements) as unconstitutional.
      sources:
      - wa_leg
      - house_r
      highest_tier: T1
      confidence: verified
  - topic: Abortion / Reproductive Rights
    topic_id: abortion
    current_position:
      claim: Voted against HB 1851 (expanding abortion provider access) and HB 1009 (student health plan abortion coverage).
      sources:
      - wa_leg
      highest_tier: T1
      confidence: verified
  - topic: Parents' Rights / Education
    topic_id: education
    current_position:
      claim: Supported I-2081 (Parents' Bill of Rights). Opposed Democratic efforts to modify it in 2025.
      sources:
      - house_r
      - wa_leg
      highest_tier: T1
      confidence: verified
  - topic: Drug Policy
    topic_id: drug_policy
    current_position:
      claim: Personally affected by family opioid/heroin addiction. Supports law enforcement tools to combat fentanyl. Favors
        treatment + accountability approach.
      sources:
      - campaign_barkis
      highest_tier: T3
      confidence: single-source
voting_record:
  votes:
  - bill_id: wa_hb_1096_2025
    bill_title: HB 1096 — Lot Splitting
    vote: yea
    date: '2025-05-19'
    sources:
    - wa_leg
    - house_r
    context: Sponsored by Barkis; championed for 3 years. Signed into law by Gov. Ferguson. Allows homeowners to split residential
      lots for additional housing.
  - bill_id: wa_hb_1143_2023
    bill_title: HB 1143 — Firearm Purchase Requirements
    vote: nay
    date: '2023-03-07'
    sources:
