public_statements:
  statements:
  - statement: The people that have been opposed to this not only don't feel their voice was heard, they see the joy about
      new taxes and they see no objective benefits.
    is_direct_quote: true
    date: '2026-03-10'
    context: During 25-hour income tax debate on SB 6346
    topic_ids:
    - taxes
  - statement: If Governor Inslee wants to fire Eatonville School employees, he needs to do it himself.
    is_direct_quote: true
    date: 2021-09
    context: Eatonville School Board meeting on vaccine mandate compliance
    topic_ids:
