political_positions:
  positions:
  - topic: Firearms / Second Amendment
    topic_id: firearms
    current_position:
      claim: Maximalist 2A position. Self-described 'avid and unapologetic Second Amendment advocate.' Opposed HB 1163 (firearms
        restrictions) and HB 2521 (background check fees). Co-hosted bipartisan 2A town hall with Rep. Marilyn Strickland
        (D).
      sources:
      - house_r
      - wa_leg
      highest_tier: T1
      confidence: verified
  - topic: Taxes / Income Tax
    topic_id: taxes
    current_position:
      claim: Opposes state income tax. Fought SB 6346 during 25-hour marathon debate. Advocates reduced property taxes and
        fiscal austerity.
      sources:
      - wa_state_std
      - wa_leg
      highest_tier: T1
      confidence: verified
  - topic: Elections / Voting
    topic_id: elections
    current_position:
      claim: Co-sponsored HB 1584 to end vote-by-mail for non-absentee voters and restore in-person polling places with photo
        ID.
      sources:
      - wa_leg
      highest_tier: T1
      confidence: verified
  - topic: Parents' Rights / Education
    topic_id: education
    current_position:
      claim: Champions Parents' Bill of Rights (I-2081). School choice advocate. Opposed Democratic modifications to I-2081.
      sources:
      - house_r
      - wa_leg
      highest_tier: T1
      confidence: verified
  - topic: Public Safety / Law Enforcement
    topic_id: public_safety
    current_position:
      claim: Strong back-the-blue stance. Supports fully staffing and funding police.
      sources:
      - campaign_marshall
      highest_tier: T3
      confidence: single-source
  - topic: COVID / Vaccine Mandates
    topic_id: covid
    current_position:
      claim: Resisted vaccine mandates as school board member. Refused to fire unvaccinated school employees. Opposed contact
        tracing devices on student athletes.
      sources:
      - komo
      - nisqually_news
      highest_tier: T2
      confidence: corroborated
voting_record:
  votes:
  - bill_id: wa_hb_1190_2025
    bill_title: HB 1190 — Mental Health Access (HEAL-WA)
    vote: yea
    date: '2025-04-07'
    sources:
    - wa_leg
    - house_r
    context: Sponsored by Marshall; passed unanimously. Expands mental health provider database access. Signed by Gov. Ferguson.
      His first bill to become law.
  - bill_id: wa_sb_6346_2026
    bill_title: SB 6346 — State Income Tax
    vote: nay
    date: '2026-03-10'
    sources:
    - wa_state_std
    - wa_leg
    context: Opposed during 25-hour marathon debate. Offered multiple amendments to limit tax reach; all rejected by Democratic
      majority.
  - bill_id: wa_hb_1163_2025
    bill_title: HB 1163 — Firearms Restrictions
    vote: nay
    date: '2025'
    sources:
    - wa_leg
    - house_r
    context: Argued for amendments to exempt veterans and National Guard members; amendments rejected.
  - bill_id: wa_hb_2521_2025
    bill_title: HB 2521 — Background Check Fees
    vote: nay
    date: '2025'
    sources:
    - wa_leg
    - house_r
    context: Warned bill 'hands bureaucrats a blank check with no cap, no guardrails.'
